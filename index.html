<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Booking </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__title">Raintech Hotels</span>
      <span class="site-header__subtitle">Room Booking</span>
    </div>
  </header>

  <main class="app-main">
    <section class="stay-details" aria-labelledby="stay-details-heading">
      <h2 class="section-heading" id="stay-details-heading">Stay Details</h2>
      <div class="stay-details__fields">
        <div class="field">
          <label for="check-in">Check-in date</label>
          <input type="date" id="check-in" name="check-in" />
        </div>
        <div class="field">
          <label for="check-out">Check-out date</label>
          <input type="date" id="check-out" name="check-out" />
        </div>
      </div>
    </section>

    <div id="error-message" class="error-message" role="alert" hidden></div>

    <div class="booking-layout">
      <section class="rooms-panel" aria-labelledby="rooms-heading">
        <div class="rooms-panel__header">
          <h2 class="section-heading" id="rooms-heading">Available Rooms</h2>
          <div class="guest-filter">
            <label for="guest-filter">Guests</label>
            <select id="guest-filter">
              <option value="1">1+</option>
              <option value="2">2+</option>
              <option value="3">3+</option>
              <option value="4">4+</option>
            </select>
          </div>
        </div>
        <div class="room-grid" id="room-list"></div>
      </section>

      <section class="summary-panel" aria-labelledby="summary-heading">
        <h2 class="section-heading" id="summary-heading">Booking Summary</h2>
        <div id="booking-summary"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
